name: Bootstrap Universal Business Platform v2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Universal-Business-Platform-v2-source.zip ]; then
            echo "Source archive not found. Upload Universal-Business-Platform-v2-source.zip first."
            exit 1
          fi

          unzip -o Universal-Business-Platform-v2-source.zip -d .
          rm -f Universal-Business-Platform-v2-source.zip
          rm -f .github/workflows/bootstrap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: extract Universal Business Platform v2 source"
          git push
